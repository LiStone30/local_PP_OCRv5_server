paddleocr:
  text_detection_model_dir: '/app/models/PaddlePaddle/PP-OCRv5_mobile_det'
  text_recognition_model_dir: '/app/models/PaddlePaddle/PP-OCRv5_server_rec'
  # 换模型只改上面 4 行(目录与名字必须一致)
  text_detection_model_name: 'PP-OCRv5_mobile_det'
  text_recognition_model_name: 'PP-OCRv5_server_rec'
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  use_textline_orientation: false
  device: 'cpu'
  # 关闭 oneDNN(mkldnn)：paddlepaddle 3.3.x 的 PIR→oneDNN 转换对部分模型报
  # (Unimplemented) ConvertPirAttribute2RuntimeAttribute not support
  enable_mkldnn: false

server:
  host: '0.0.0.0'
  port: 8118
  # keep-alive 空闲超时（秒）：uvicorn 默认 5s，调用方连接池会因此频繁重连（README §1.5.13）
  timeout_keep_alive: 75
  # SIGTERM 后等当前请求收尾的宽限时间（秒）
  timeout_graceful_shutdown: 10
